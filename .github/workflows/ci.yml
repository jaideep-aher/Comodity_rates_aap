name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=optional=false
      - run: npm run typecheck

  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bajarbhav
          POSTGRES_PASSWORD: bajarbhav
          POSTGRES_DB: bajarbhav
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bajarbhav"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Migrate
        run: npm run migrate
        env:
          DATABASE_URL: postgres://bajarbhav:bajarbhav@localhost:5432/bajarbhav

  docker:
    name: Backend Docker build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: bajarbhav-backend:ci
